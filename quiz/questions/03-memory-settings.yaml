category: "记忆与设置"
category_id: 3
source_file: "guide/ultimate-guide.md"

questions:
  - id: "03-001"
    difficulty: "junior"
    profiles: ["junior", "senior", "power", "pm"]
    question: "CLAUDE.md 文件的正确优先级顺序（从高到低）是什么？"
    options:
      a: "全局 > 项目 > 本地"
      b: "本地（.claude/CLAUDE.md） > 项目（/project/CLAUDE.md） > 全局（~/.claude/CLAUDE.md）"
      c: "项目 > 本地 > 全局"
      d: "所有 CLAUDE.md 文件优先级相同"
    correct: "b"
    explanation: |
      优先级是：本地（.claude/CLAUDE.md） > 项目（/project/CLAUDE.md） > 全局（~/.claude/CLAUDE.md）。更具体的覆盖更一般的。本地覆盖是个人的（git 忽略），项目设置是共享的（提交），全局设置适用于所有项目。这种层次结构允许个人偏好根据需要覆盖团队约定。企业注意：managed-settings.d/ 提供了管理员控制的治理层，位于所有三个级别之上——部署在那里的策略不能被任何用户级 CLAUDE.md 覆盖。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.4 优先级规则"
      anchor: "#claude-precedence"

  - id: "03-002"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "团队约定应该存储在哪里以便通过版本控制共享？"
    options:
      a: "~/.claude/CLAUDE.md"
      b: "/project/.claude/CLAUDE.md"
      c: "/project/CLAUDE.md"
      d: "/project/.claude/settings.local.json"
    correct: "c"
    explanation: |
      团队约定应该存储在 /project/CLAUDE.md（项目根目录）。这个文件被提交到 git 并与团队共享。本地覆盖放在 /project/.claude/CLAUDE.md（git 忽略），个人全局偏好放在 ~/.claude/CLAUDE.md。这种分离确保了团队标准的执行，同时允许个人自定义。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.1 记忆文件（CLAUDE.md）"
      anchor: "#level-2-project-claudemd"

  - id: "03-003"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "settings.local.json 的用途是什么？"
    options:
      a: "存储团队钩子配置"
      b: "定义项目范围设置"
      c: "个人权限覆盖（git 忽略）"
      d: "为团队配置 MCP 服务器"
    correct: "c"
    explanation: |
      settings.local.json 存储个人权限覆盖并且 git 忽略。它允许您自定义哪些工具是自动允许、拒绝或要求针对您个人工作流，而不影响团队设置。例如，您可以允许所有 git 命令，而团队要求某些操作需要确认。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.3 设置与权限"
      anchor: "#settingslocaljson-personal-permissions"

  - id: "03-004"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "哪个文件夹包含自定义智能体、命令、钩子和技能？"
    options:
      a: "~/.claude/"
      b: "/project/CLAUDE.md"
      c: "/project/.claude/"
      d: "/project/config/"
    correct: "c"
    explanation: |
      项目中的 .claude/ 文件夹包含：智能体/（自定义智能体定义）、命令/（自定义斜杠命令）、钩子/（事件驱动脚本）、技能/（知识模块）、规则/（自动加载约定）和设置文件。这是您项目的 Claude Code 配置目录，用于所有扩展。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.2 .claude/ 文件夹结构"
      anchor: "#full-structure"

  - id: "03-005"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "在 'deny' 类别中列出的工具的权限行为是什么？"
    options:
      a: "每次都询问确认"
      b: "自动批准不询问"
      c: "完全阻止"
      d: "记录但允许"
    correct: "c"
    explanation: |
      'deny' 类别中的工具被完全阻止——Claude 根本无法使用它们。三种权限行为是：'allow'（自动批准不询问）、'deny'（完全阻止）、'ask'（提示确认）。例如，阻止 'Bash(rm -rf *)' 可以防止意外破坏性操作。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.3 设置与权限"
      anchor: "#permission-behavior"

  - id: "03-006"
    difficulty: "power"
    profiles: ["power"]
    question: "多工具 AI 设置的 '单一事实来源模式' 是什么？"
    options:
      a: "每个项目只使用一个 AI 工具"
      b: "将约定存储在 docs/conventions/ 中并从所有 AI 工具配置中引用它们"
      c: "将相同规则复制到每个 AI 工具的配置"
      d: "让每个 AI 工具定义自己的规则"
    correct: "b"
    explanation: |
      单一事实来源模式将约定存储在 /docs/conventions/（coding-standards.md、architecture.md、testing.md 等）中，并从 CLAUDE.md、CodeRabbit 和其他工具中引用它们。这可以防止一个工具批准另一个工具标记为问题的代码的冲突。所有工具都从一个来源执行相同的标准。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.1 记忆文件（CLAUDE.md）"
      anchor: "#single-source-of-truth-pattern"

  - id: "03-007"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "项目级 CLAUDE.md 文件应该包含什么？"
    options:
      a: "只包含个人偏好"
      b: "技术栈、代码约定、架构模式和常用命令"
      c: "API 密钥和秘密"
      d: "Git 历史"
    correct: "b"
    explanation: |
      项目 CLAUDE.md 应该包含：技术栈（框架、版本）、代码约定（命名、模式）、架构（文件夹结构、分层）和常用命令（开发、测试、lint）。这为 Claude 提供了项目上下文。永远不要包含 API 密钥或秘密。保持简洁并附带示例，当约定更改时更新。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.1 记忆文件（CLAUDE.md）"
      anchor: "#level-2-project-claudemd"

  - id: "03-008"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "权限模式 'Bash(git *)' 匹配什么？"
    options:
      a: "只匹配精确的 'git' 命令"
      b: "任何 git 命令"
      c: "以星号开头的 git 命令"
      d: "带 glob 模式的 git 命令"
    correct: "b"
    explanation: |
      模式 'Bash(git *)' 匹配任何 git 命令。权限模式使用通配符：'Bash(git *)' 匹配任何 git 命令，'Bash(pnpm *)' 匹配任何 pnpm 命令，'mcp__serena__*' 匹配所有 Serena MCP 工具。您也可以使用特定模式，如 'Bash(git status *)' 只匹配 git status。注意：旧的 ':*' 后缀语法已弃用，请使用空格代替（例如 'Bash(git *)' 而不是 'Bash(git:*)'）。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.3 设置与权限"
      anchor: "#permission-patterns"

  - id: "03-009"
    difficulty: "power"
    profiles: ["power"]
    question: "什么是 '动态记忆'（配置文件切换）？"
    options:
      a: "Claude 跨会话记忆的能力"
      b: "临时修改 CLAUDE.md 用于特定任务，然后恢复"
      c: "自动记忆压缩"
      d: "跨设备同步记忆"
    correct: "b"
    explanation: |
      动态记忆意味着临时修改 CLAUDE.md 用于特定任务，然后恢复。技术包括：git stash（保存原始、修改、恢复）、配置文件库（将配置文件如 security-audit.md、debugging.md 保存在 ~/.claude/profiles/ 中）或并行实例（不同工作树中的不同 CLAUDE.md）。使用脚本切换配置文件：'claude-profile security-audit'。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.3 设置与权限"
      anchor: "#dynamic-memory-profile-switching"

  - id: "03-010"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: ".claude/rules/ 目录中的文件会发生什么？"
    options:
      a: "必须手动导入它们"
      b: "它们会自动加载并合并"
      c: "它们覆盖 CLAUDE.md"
      d: "除非引用否则被引用否则被忽略"
    correct: "b"
    explanation: |
      .claude/rules/ 中的文件会自动加载并合并。您可以创建多个文件，如 code-conventions.md、git-workflow.md 和 architecture.md——所有都自动加载无需手动导入。这允许对 Claude 遵循的项目约定的模块化组织。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.4 优先级规则"
      anchor: "#rules-auto-loading"

  - id: "03-011"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "以下哪些应该被 git 忽略？"
    options:
      a: "/project/CLAUDE.md"
      b: ".claude/agents/"
      c: ".claude/settings.local.json 和 .claude/CLAUDE.md"
      d: ".claude/hooks/"
    correct: "c"
    explanation: |
      应该被 git 忽略的文件是：.claude/CLAUDE.md（本地个人指令）和 .claude/settings.local.json（个人权限）。应该提交的文件包括：agents/、commands/、hooks/、skills/、rules/ 和 settings.json。这种分离允许在共享团队配置的同时允许个人自定义。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.2 .claude/ 文件夹结构"
      anchor: "#what-goes-where"

  - id: "03-012"
    difficulty: "power"
    profiles: ["power"]
    question: "allowedTools 配置与权限类别有什么不同？"
    options:
      a: "没有不同，它们是相同的"
      b: "在 ~/.claude/settings.json 中通过工具特定模式提供精细控制"
      c: "只适用于 MCP 工具"
      d: "需要管理员权限"
    correct: "b"
    explanation: |
      ~/.claude/settings.json 中的 allowedTools 配置通过特定模式提供精细控制。例如：'Read' 允许所有读取，'Bash(git status *)' 只允许 git status，'Bash(pnpm *)' 允许 pnpm 命令。您可以从初学者（非常严格）到高级设置渐进权限级别。永远不要使用 --dangerously-skip-permissions。注意：对于“所有用途”使用不带括号的工具名称（例如 'Read' 而不是 'Read(*)'）。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.3 设置与权限"
      anchor: "#allowedtools-configuration-alternative"

  - id: "03-013"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "macOS/Linux 上的全局配置路径是什么？"
    options:
      a: "/etc/claude/"
      b: "~/.claude/"
      c: "/usr/local/claude/"
      d: "~/.config/claude/"
    correct: "b"
    explanation: |
      在 macOS/Linux 上，全局配置路径是 ~/.claude/。在 Windows 上是 %USERPROFILE%\.claude\ 或 C:\Users\YourName\.claude\。这个目录包含您的全局 CLAUDE.md、设置，并且可以包含用于动态记忆切换的 profiles/ 子目录。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "1.1 安装"
      anchor: "#platform-specific-paths"

  - id: "03-014"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "allowedTools 中渐进式权限的三个级别是什么？"
    options:
      a: "管理员、用户、访客"
      b: "初学者（非常严格）、中级、高级"
      c: "读取、写入、执行"
      d: "低、中、高"
    correct: "b"
    explanation: |
      三个渐进式权限级别是：初学者（非常严格——只有 Read、Grep、Glob）、中级（添加 Bash git/pnpm、TodoRead/Write）、高级（添加 Edit、Write、WebFetch、Task）。开始时保持严格，并随着信心增强而扩展。这可以防止在学习时发生事故。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.3 设置与权限"
      anchor: "#progressive-permission-levels"

  - id: "03-015"
    difficulty: "power"
    profiles: ["power"]
    question: "为什么您永远不应该使用 --dangerously-skip-permissions？"
    options:
      a: "它已被弃用"
      b: "它可能导致破坏性操作，如 rm -rf、强制推送到主分支或删除表"
      c: "它成本更高"
      d: "它更慢"
    correct: "b"
    explanation: |
      永远不要使用 --dangerously-skip-permissions，因为它可能导致破坏性操作。恐怖故事包括：'rm -rf node_modules' 后跟 'rm -rf .'（路径错误），无意将 'git push --force' 推送到主分支，在错误生成的迁移中 'DROP TABLE users'，以及删除带有凭据的 .env 文件。始终优先使用精细的 allowedTools。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.3 设置与权限"
      anchor: "#-warning-never-use-dangerously-skip-permissions"

  - id: "03-016"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "全局 CLAUDE.md 应该包含什么？"
    options:
      a: "项目特定的代码约定"
      b: "适用于所有项目的个人偏好（沟通风格、首选工具、安全规则"
      c: "团队成员联系信息"
      d: "Git 提交历史"
    correct: "b"
    explanation: |
      全局 CLAUDE.md (~/.claude/CLAUDE.md 应该包含适用于所有项目的个人偏好：沟通风格（简洁，使用代码示例）、首选工具（TypeScript 优于 JavaScript、pnpm 优于 npm）和安全规则（始终运行测试，从不强制推送）。项目特定设置放在项目 CLAUDE.md 中。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.1 记忆文件（CLAUDE.md）"
      anchor: "#level-1-global-claudeclaudemd"

  - id: "03-017"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "settings.json（而不是 settings.local.json 存储什么？"
    options:
      a: "个人权限"
      b: "钩子配置，提交到仓库"
      c: "API 密钥"
      d: "成本跟踪数据"
    correct: "b"
    explanation: |
      settings.json 存储钩子配置并提交到仓库以供团队共享。它定义了 PreToolUse、PostToolUse、UserPromptSubmit 事件的钩子——指定匹配器和钩子脚本。个人权限覆盖放在 settings.local.json（git 忽略）。这种分离允许在尊重个人偏好的同时进行团队自动化。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "3.3 设置与权限"
      anchor: "#settingsjson-team-configuration"

  - id: "03-018"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "指南推荐多少个验证域用于全面质量检查？"
    options:
      a: "3 个域（lint、test、build）"
      b: "8 个域：前端、后端、类型、样式、性能、可访问性、安全性、UX"
      c: "5 个域：语法、逻辑、性能、安全、风格"
      d: "12 个域，覆盖每个可能的检查"
    correct: "b"
    explanation: |
      Boris Cherny 的验证循环推荐用于全面质量的 8 个域：1. 前端（UI 渲染正确）2. 后端（API 正确响应）3. 类型（TypeScript/类型检查通过）4. 样式（lint 通过）5. 性能（无回归）6. 可访问性（WCAG 合规性）7. 安全（无漏洞）8. UX（用户流程端到端工作）。CLAUDE.md 应该定义每种更改要检查的域。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "验证循环"
      anchor: "#verification-loops"

  - id: "03-019"
    difficulty: "intermediate"
    profiles: ["junior", "senior", "power"]
    question: "什么是 '新鲜上下文模式'，何时应该使用它？"
